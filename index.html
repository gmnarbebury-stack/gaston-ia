<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#22334C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastón AI">
<title>Gastón AI — Elevato</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#22334C;--gold:#A9926D;--gold-l:#C8AE8A;
  --dark:#0D1520;--mid:#1A2840;--muted:#8899AA;
  --white:#ffffff;--border:rgba(169,146,109,0.2);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--dark);color:var(--white);height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

/* TOP BAR */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--blue);border-bottom:1px solid var(--border);flex-shrink:0;padding-top:env(safe-area-inset-top,12px);}
#topbar .logo{font-size:11px;color:var(--gold);letter-spacing:2px;font-weight:600;}
#topbar .title{font-size:15px;font-weight:500;}
#mode-selector{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--white);font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;outline:none;}

/* MESSAGES */
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;}
#messages::-webkit-scrollbar{display:none;}

.msg{display:flex;gap:10px;animation:fadeIn 0.2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse;}
.avatar{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
.avatar.a{background:rgba(169,146,109,0.2);color:var(--gold);}
.avatar.u{background:var(--blue);color:var(--white);font-size:10px;}
.bubble{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.65;max-width:82%;}
.msg.a .bubble{background:var(--mid);border:1px solid var(--border);color:#D8E4EE;border-radius:4px 12px 12px 12px;}
.msg.u .bubble{background:var(--blue);color:var(--white);border-radius:12px 4px 12px 12px;}
.bubble strong{color:var(--gold);}
.bubble code{background:rgba(0,0,0,0.3);padding:1px 5px;border-radius:4px;font-family:monospace;font-size:12px;color:#9FD8FF;}
.bubble pre{background:rgba(0,0,0,0.35);border:1px solid var(--border);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;font-size:12px;}
.bubble ul,.bubble ol{padding-left:16px;margin:4px 0;}
.bubble li{margin-bottom:2px;}
.bubble h3{color:var(--gold);font-size:13px;margin:8px 0 3px;}
.bubble p{margin-bottom:4px;}
.bubble p:last-child{margin-bottom:0;}
.bubble table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0;}
.bubble th{background:rgba(169,146,109,0.15);padding:5px 8px;color:var(--gold);text-align:left;}
.bubble td{padding:4px 8px;border-top:1px solid rgba(255,255,255,0.06);}

/* TYPING */
.typing{display:flex;align-items:center;gap:4px;padding:12px 14px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* QUICK ACTIONS */
#quick{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;}
#quick::-webkit-scrollbar{display:none;}
.qa{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:#AAB8C8;font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.qa:active{background:rgba(169,146,109,0.15);border-color:var(--gold);color:var(--gold);}

/* WELCOME */
#welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:30px 20px;}
#welcome .ico{font-size:40px;margin-bottom:14px;}
#welcome h2{font-size:20px;font-weight:500;margin-bottom:6px;}
#welcome p{color:var(--muted);font-size:13px;max-width:300px;line-height:1.6;margin-bottom:22px;}
.sug-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:400px;}
.sug{background:var(--mid);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:left;cursor:pointer;}
.sug:active{border-color:var(--gold);}
.sug .si{font-size:18px;margin-bottom:6px;}
.sug .st{font-size:12px;font-weight:500;color:var(--white);margin-bottom:3px;}
.sug .ss{font-size:11px;color:var(--muted);line-height:1.3;}

/* INPUT */
#inputarea{padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--mid);border-top:1px solid var(--border);flex-shrink:0;}
#inputrow{display:flex;gap:8px;align-items:flex-end;}
#inp{flex:1;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:10px;padding:10px 13px;color:var(--white);font-size:15px;font-family:inherit;resize:none;min-height:42px;max-height:120px;outline:none;line-height:1.5;}
#inp:focus{border-color:var(--gold);}
#inp::placeholder{color:var(--muted);}
#sendbtn{width:42px;height:42px;border-radius:10px;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#sendbtn:active{background:var(--gold-l);transform:scale(0.95);}
#sendbtn svg{width:18px;height:18px;fill:var(--dark);}
</style>
</head>
<body>

<div id="topbar">
  <div>
    <div class="logo">ELEVATO GROUP</div>
    <div class="title">Gastón AI ⚡</div>
  </div>
  <select id="mode-selector" onchange="setMode(this.value)">
    <option value="general">💬 General</option>
    <option value="real_estate">🏢 Real Estate</option>
    <option value="research">🔍 Research</option>
    <option value="docs">📄 Documentos</option>
    <option value="tasks">✅ Tareas</option>
    <option value="strategy">🎯 Estrategia</option>
  </select>
</div>

<div id="wrap" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
  <div id="welcome">
    <div class="ico">⚡</div>
    <h2>Hola Gastón</h2>
    <p>Tu asistente personal Elevato. ¿En qué arrancamos?</p>
    <div class="sug-grid">
      <div class="sug" onclick="go('Analizá el mercado inmobiliario de Neuquén para el sector oil & gas en 2026')">
        <div class="si">📊</div><div class="st">Mercado NQN</div><div class="ss">Análisis Vaca Muerta y retail</div>
      </div>
      <div class="sug" onclick="go('Hacé un resumen ejecutivo del Strip Mall Plataforma Neuquén: 4200m2 sobre Ruta 22, inquilinos ON CITY y MQ BAZAR, inicio de obra Junio 2026')">
        <div class="si">🏢</div><div class="st">Strip Mall NQN</div><div class="ss">Resumen ejecutivo del proyecto</div>
      </div>
      <div class="sug" onclick="go('Redactá un email profesional para presentar Plataforma Neuquén a un inversor institucional')">
        <div class="si">✉️</div><div class="st">Email inversor</div><div class="ss">Pitch profesional listo</div>
      </div>
      <div class="sug" onclick="go('¿Qué debería priorizar esta semana para avanzar con los proyectos de Elevato Group?')">
        <div class="si">🎯</div><div class="st">Prioridades hoy</div><div class="ss">Qué hacer esta semana</div>
      </div>
    </div>
  </div>
  <div id="messages" style="display:none;"></div>
</div>

<div id="quick"></div>

<div id="inputarea">
  <div id="inputrow">
    <textarea id="inp" placeholder="Escribí tu consulta..." rows="1"
      onkeydown="handleKey(event)" oninput="resize(this)"></textarea>
    <button id="sendbtn" onclick="send()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const MODES={
  general:{
    system:system:`Sos el asistente estratégico, operativo y financiero de alto nivel de Gastón Narbeury.

PERFIL: Emprendedor argentino, operador y estratega. Directo, exigente, práctico. Alto nivel, no explicar lo básico. Ir al grano, no repetir, no suavizar, entregar soluciones listas.

EMPRESAS:
1. MOTE GREEN MARKET: retail saludable (frutas, verduras, dietética). E-commerce + delivery + pick-up. 2 turnos, 16 pedidos/turno, 1 camioneta. Problemas: cuello de botella en armado, retrasos segundo turno, falta sistema de stock.
2. ELEVATOGROUP: consultora + desarrollo inmobiliario. Detecta oportunidades, analiza normativa, diseña proyectos, consigue operadores, estructura contratos, captura valor. Objetivo: pasar de intermediario a equity propio.

PROYECTOS ACTIVOS:
- PedidosYa: dark store, contrato cerrado, replicar modelo
- Strip Mall NQN: R22, 4200m2, ON CITY + MQ BAZAR, inicio obra Junio 2026
- Zona 135-1 NQN: 80450m2, La Anónima anchor, desarrollo mixto
- Funes SF: corredor RP-34S, retail/strip center
- Pilar/Escobar: retail + logística, zonificación IMIXC
- San Nicolás: lote ~1025m2, negociación
- Rosario Av. San Martín 5263: compra + locación, Leonardo Tenaglia

CONTACTOS: Leonardo Tenaglia (broker), Nacho (socio), Ezequiel (arquitecto), Alan (dev web), Ludmila (operación). Corporativos: PedidosYa, Chango Más, La Anónima, Toribio Achával.

FORMA DE TRABAJO: Excel intensivo, itera rápido, todo en números. Siempre considerar: CAPEX, OPEX, ROI, NPV, IRR, Payback, inflación vs USD. No sabe programar.

OBJETIVO: "Construir un sistema que pase de generar ingresos por operación a generar riqueza por activos."

Respondé siempre: directo al punto, soluciones accionables, números concretos, como socio estratégico senior. Español argentino.`,
    qa:['¿Qué priorizar?','Checklist proyecto','Seguimiento deals','Plan semana']
  },
  strategy:{
    system:`Sos el asesor estratégico de Gastón Narbeury / Elevato Group.

Pensás en grande: expansión, posicionamiento, deal flow, alianzas, modelo de negocio. Combinás visión de largo plazo con pragmatismo argentino.

Elevato Group: desarrollos + consultoría, foco Patagonia/NQN, anchors nacionales, escala real.`,
    qa:['Estrategia expansión','Análisis competitivo','Posicionamiento','Próximos movimientos']
  }
};

let mode='general';
let msgs=[];
let busy=false;

function setMode(m){
  mode=m;
  updateQA();
}

function updateQA(){
  const qa=document.getElementById('quick');
  qa.innerHTML=MODES[mode].qa.map(a=>`<button class="qa" onclick="go('${a.replace(/'/g,"\\'")}'">${a}</button>`).join('');
}

function showChat(){
  document.getElementById('welcome').style.display='none';
  document.getElementById('messages').style.display='flex';
}

function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
}

function resize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}

function go(text){
  document.getElementById('inp').value=text;
  send();
}

function addMsg(role,content){
  showChat();
  const msgs=document.getElementById('messages');
  const d=document.createElement('div');
  d.className='msg '+(role==='assistant'?'a':'u');
  const av=document.createElement('div');
  av.className='avatar '+(role==='assistant'?'a':'u');
  av.textContent=role==='assistant'?'⚡':'GN';
  const b=document.createElement('div');
  b.className='bubble';
  b.innerHTML=role==='assistant'?md(content):esc(content);
  d.appendChild(av);d.appendChild(b);
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
  return b;
}

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function md(t){
  return t
    .replace(/```[\w]*\n([\s\S]*?)```/g,(_,c)=>`<pre><code>${esc(c.trim())}</code></pre>`)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^[\-\*] (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>')
    .replace(/^(?!<)(.+)/gm,'<p>$1</p>')
    .replace(/<p><\/p>/g,'');
}

let typingEl=null;
function showTyping(){
  showChat();
  const msgs=document.getElementById('messages');
  const d=document.createElement('div');
  d.className='msg a';d.id='typing';
  const av=document.createElement('div');av.className='avatar a';av.textContent='⚡';
  const b=document.createElement('div');b.className='bubble';
  b.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  d.appendChild(av);d.appendChild(b);
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
  typingEl=d;
}
function removeTyping(){if(typingEl){typingEl.remove();typingEl=null;}}

async function send(){
  const inp=document.getElementById('inp');
  const text=inp.value.trim();
  if(!text||busy)return;
  inp.value='';inp.style.height='auto';
  busy=true;
  document.getElementById('sendbtn').disabled=true;

  msgs.push({role:'user',content:text});
  addMsg('user',text);
  showTyping();

  try{
    const r=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:msgs.slice(-14),system:MODES[mode].system})
    });
    const data=await r.json();
    removeTyping();
    if(data.error)throw new Error(data.error.message||JSON.stringify(data.error));
    const reply=data.content?.[0]?.text||'Sin respuesta.';
    msgs.push({role:'assistant',content:reply});
    addMsg('assistant',reply);
  }catch(err){
    removeTyping();
    addMsg('assistant',`**Error:** ${err.message}`);
  }

  busy=false;
  document.getElementById('sendbtn').disabled=false;
  inp.focus();
}

updateQA();
setTimeout(()=>document.getElementById('inp').focus(),300);
</script>
</body>
</html>
